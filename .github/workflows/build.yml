name: Frontend build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Compile-only placeholder; this artifact is not a production deployment.
      VITE_API_BASE_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Verify inventory and report calculations
        run: node --test scripts/inventoryLogic.test.mjs scripts/reports.test.mjs
      - name: Verify build artifact
        run: test -s dist/index.html
